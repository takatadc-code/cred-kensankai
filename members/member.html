<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>会員ページ | Salon de CRED</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<header class="site">
  <div class="inner">
    <h1 id="salon-name">Salon de CRED</h1>
    <div class="head-actions">
      <a class="ghost admin" id="admin-link" href="admin.html" hidden>運営管理</a>
      <button class="ghost" id="logout-btn" hidden>ログアウト</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="card" id="status-card" hidden>
    <div class="status-line">
      <span id="member-email">-</span>
      <span class="badge" id="member-badge" hidden></span>
    </div>
    <div class="note" id="member-period"></div>
  </div>

  <!-- 本日の例会（該当があるときだけ表示） -->
  <div id="today-area"></div>

  <div class="card" id="main-card">
    <div class="skeleton" id="loading">読み込んでいます…</div>

    <div id="denied" hidden>
      <h2 id="denied-title">ご利用いただけません</h2>
      <p id="denied-body" class="note"></p>
      <p class="note">お問い合わせ： <a id="contact-link" href="#">-</a></p>
      <p><button class="ghost" id="denied-logout">別のアドレスでログインし直す</button></p>
    </div>

    <div id="contents" hidden>
      <h2>これまでの例会・お知らせ</h2>
      <div id="content-list"></div>
      <p class="note" id="empty-note" hidden>
        現在、公開中のコンテンツはありません。
      </p>
    </div>
  </div>

  <div class="card" id="notice-card" hidden>
    <h2 class="note" style="font-size:16px;margin-bottom:8px;">お願い</h2>
    <p class="note" style="margin:0">
      配信URLは会員限定です。SNS・グループチャット等への転載はご遠慮ください。
    </p>
  </div>

</div>

<footer class="site">
  <span id="footer-name">Salon de CRED</span> 会員ページ
</footer>

<script type="module">
  import { supabase, cfg, formatDate, todayStr } from './app.js';

  document.getElementById('salon-name').textContent  = cfg.SALON_NAME;
  document.getElementById('footer-name').textContent = cfg.SALON_NAME;
  document.title = `会員ページ | ${cfg.SALON_NAME}`;

  const contact = document.getElementById('contact-link');
  contact.textContent = cfg.CONTACT_EMAIL;
  contact.href = `mailto:${cfg.CONTACT_EMAIL}`;

  const loading    = document.getElementById('loading');
  const denied     = document.getElementById('denied');
  const contentsEl = document.getElementById('contents');
  const todayArea  = document.getElementById('today-area');

  function showDenied(title, body) {
    loading.hidden = true;
    denied.hidden = false;
    document.getElementById('denied-title').textContent = title;
    document.getElementById('denied-body').textContent = body;
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.replace('index.html');
  }
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('denied-logout').addEventListener('click', logout);

  function thumbImage(url, title) {
    if (!url) return null;
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = url;
    img.alt = title;
    img.loading = 'lazy';
    return img;
  }

  /** 「8月15日 20:00 まで視聴できます」 */
  function untilText(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())} まで視聴できます`;
  }

  function linkButton(href, label, extraClass) {
    const a = document.createElement('a');
    a.className = 'watch' + (extraClass ? ` ${extraClass}` : '');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = label;
    return a;
  }

  // ---- 本日の例会 -------------------------------------------------------
  // ZOOM の URL は事前に分かるが、YouTube 限定配信の URL は配信開始後にしか
  // 発行されない。まだ入っていない場合は「配信開始後に表示されます」と案内し、
  // 30秒ごとの自動更新で、運営が貼った瞬間に視聴ボタンが出るようにする。
  function renderToday(items) {
    todayArea.textContent = '';
    if (!items.length) return;

    for (const c of items) {
      const card = document.createElement('div');
      card.className = 'card live';

      const badge = document.createElement('span');
      badge.className = 'live-badge';
      badge.textContent = '本日の例会';
      card.appendChild(badge);

      const thumb = thumbImage(c.thumbnail_url, c.title);
      if (thumb) card.appendChild(thumb);

      const h2 = document.createElement('h2');
      h2.textContent = c.title;
      card.appendChild(h2);

      if (c.body) {
        const b = document.createElement('div');
        b.className = 'body';
        b.textContent = c.body;
        card.appendChild(b);
      }

      const actions = document.createElement('div');
      actions.className = 'live-actions';

      if (c.zoom_url) actions.appendChild(linkButton(c.zoom_url, 'ZOOMで参加する', 'zoom'));
      if (c.url)      actions.appendChild(linkButton(c.url, '配信を見る'));

      if (actions.childElementCount) card.appendChild(actions);

      if (!c.url) {
        const wait = document.createElement('div');
        wait.className = 'waiting';
        wait.textContent =
          '配信の視聴URLは、配信開始後にこの画面に表示されます。' +
          'この画面は自動で更新されますので、開いたままお待ちください。';
        card.appendChild(wait);
      }

      if (c.archive_until && c.url) {
        const u = document.createElement('div');
        u.className = 'refreshed';
        u.textContent = untilText(c.archive_until);
        card.appendChild(u);
      }

      const stamp = document.createElement('div');
      stamp.className = 'refreshed';
      const now = new Date();
      const p = (n) => String(n).padStart(2, '0');
      stamp.textContent = `最終更新 ${p(now.getHours())}:${p(now.getMinutes())}`;
      card.appendChild(stamp);

      todayArea.appendChild(card);
    }
  }

  // ---- これまでの例会 ---------------------------------------------------
  function renderPast(items) {
    const list = document.getElementById('content-list');
    list.textContent = '';

    document.getElementById('empty-note').hidden = items.length > 0;

    for (const c of items) {
      const item = document.createElement('div');
      item.className = 'content-item';

      const thumb = thumbImage(c.thumbnail_url, c.title);
      if (thumb) item.appendChild(thumb);

      const h3 = document.createElement('h3');
      h3.textContent = c.title;
      item.appendChild(h3);

      if (c.event_date) {
        const d = document.createElement('div');
        d.className = 'date';
        d.textContent = formatDate(c.event_date);
        item.appendChild(d);
      }

      if (c.body) {
        const b = document.createElement('div');
        b.className = 'body';
        b.textContent = c.body;   // textContent なので HTML 混入の心配はない
        item.appendChild(b);
      }

      const actions = document.createElement('div');
      actions.className = 'live-actions';
      if (c.zoom_url) actions.appendChild(linkButton(c.zoom_url, 'ZOOMで参加する', 'zoom'));
      if (c.url) {
        actions.appendChild(
          linkButton(c.url, c.kind === 'video' ? '動画を見る' : '資料を開く'));
      }
      if (actions.childElementCount) item.appendChild(actions);

      if (c.archive_until && c.url) {
        const u = document.createElement('div');
        u.className = 'refreshed';
        u.textContent = untilText(c.archive_until);
        item.appendChild(u);
      }

      list.appendChild(item);
    }
  }

  // ---- 取得 -------------------------------------------------------------
  // 有効会員でなければ RLS が 0 件を返すため、URL が漏れることはない
  async function loadContents() {
    const { data, error } = await supabase
      .from('contents')
      .select('title, kind, url, zoom_url, body, event_date, thumbnail_url, archive_until')
      .eq('is_published', true)
      .order('event_date', { ascending: false, nullsFirst: false })
      .order('created_at', { ascending: false });

    if (error) return { error };

    const today = todayStr();
    return {
      today: data.filter((c) => c.event_date === today),
      past:  data.filter((c) => c.event_date !== today),
    };
  }

  async function main() {
    // ---- 1. ログイン確認 ------------------------------------------------
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.replace('index.html');
      return;
    }

    const email = (session.user.email || '').toLowerCase();
    document.getElementById('logout-btn').hidden = false;

    // ---- 2. 会員資格の確認 ----------------------------------------------
    // RLS により、自分の行しか取得できない
    const { data: member, error: memberErr } = await supabase
      .from('members')
      .select('display_name, status, current_period_end, role')
      .eq('email', email)
      .maybeSingle();

    if (memberErr) {
      showDenied('エラーが発生しました',
        `会員情報を取得できませんでした。時間をおいてお試しください。（${memberErr.message}）`);
      return;
    }

    if (!member) {
      showDenied('会員として登録されていません',
        `${email} は会員名簿に登録がありません。` +
        '会費のお支払いに使っているメールアドレスと異なる可能性があります。' +
        'お手数ですが事務局までご連絡ください。');
      return;
    }

    const expired =
      member.current_period_end && member.current_period_end < todayStr();
    const active = ['active', 'grace'].includes(member.status) && !expired;

    // 運営（管理者）のときだけ、管理画面へのリンクを出す。
    // 一般会員にはそもそも表示されず、URLを直接開いても RLS で弾かれる。
    if (member.role === 'admin' && active) {
      document.getElementById('admin-link').hidden = false;
    }

    document.getElementById('status-card').hidden = false;
    document.getElementById('member-email').textContent =
      member.display_name ? `${member.display_name} 様（${email}）` : email;

    if (!active) {
      showDenied('会員資格が有効ではありません',
        member.status === 'cancelled'
          ? '退会済みのため、会員限定コンテンツはご覧いただけません。再入会をご希望の場合は事務局までご連絡ください。'
          : 'お支払いの有効期限が切れています。ご継続の場合は事務局までご連絡ください。');
      return;
    }

    const badge = document.getElementById('member-badge');
    badge.hidden = false;
    badge.className = `badge ${member.status}`;
    badge.textContent = member.status === 'grace' ? 'お支払い確認中' : '有効会員';
    document.getElementById('member-period').textContent =
      member.current_period_end ? `有効期限：${formatDate(member.current_period_end)}` : '';

    // ---- 3. コンテンツ ---------------------------------------------------
    const first = await loadContents();
    if (first.error) {
      showDenied('エラーが発生しました',
        `コンテンツを取得できませんでした。時間をおいてお試しください。（${first.error.message}）`);
      return;
    }

    loading.hidden = true;
    contentsEl.hidden = false;
    document.getElementById('notice-card').hidden = false;

    renderToday(first.today);
    renderPast(first.past);

    // 配信開始後に運営が視聴URLを追記したら、待っている会員の画面にも
    // すぐ反映されるよう定期的に取り直す
    setInterval(async () => {
      if (document.hidden) return;          // 裏に回っている間は取りに行かない
      const r = await loadContents();
      if (r.error) return;                  // 一時的な失敗は黙って次の周期に任せる
      renderToday(r.today);
      renderPast(r.past);
    }, 30000);
  }

  main();
</script>

</body>
</html>
